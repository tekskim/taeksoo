<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSoT</title>
    <!-- Pretendard Font for Korean -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- Michroma Font for Logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
    <!-- Prevent FOUC: Apply theme before page renders -->
    <script>
      (function() {
        var urlTheme = new URLSearchParams(window.location.search).get('theme');
        var theme = urlTheme || localStorage.getItem('tds-theme');
        var isDark = theme === 'dark' || 
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!-- Figma Capture Script -->
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <!-- Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: var(--color-surface-subtle, #f8fafc);">
    <div id="root" style="min-height: 100vh; background-color: var(--color-surface-subtle, #f8fafc);"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
